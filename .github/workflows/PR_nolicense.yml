# This workflow uses `pull_request` which does not have access to a WLS license, it is just safer to use
# and will be started for any newly opened PRs or when a change is pushed to the PR.
#
# Since the WLS license is missing, this workflow runs a limited set of tests:
# - It skips the examples target in tox,
# - In pytest, some tests are annotated as needing a WLS license. These are automatically skipped.

name: build and test PR, no license

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        uses: ./.github/actions/lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        gurobi-version: ["gurobi12","gurobi13"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: ./.github/actions/setup-python-and-install
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Test with tox (uv), excluding the examples target
        env:
          GUROBI_VERSION: ${{ matrix.gurobi-version }}
        run: |
          uvx tox
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12' && matrix.gurobi-version == 'gurobi13' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-python
          path: coverage.xml

  upload-coverage-python:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-python
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage-agent
